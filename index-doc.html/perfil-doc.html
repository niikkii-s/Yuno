<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil | Yuno-Doc</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="perfil-doc.css">

</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h1 class="logo">
            <a href="index-doc.html">Yuno</a>
        </h1>

        <nav>

            <ul>

                <li>
                    <a href="perfil-doc.html" class="activo">
                        Mi perfil
                    </a>
                </li>

                <li>
                    <a href="chat-doc.html">
                        Chat
                    </a>
                </li>

                <li>
                    <a href="pacientes.html">
                        Pacientes
                    </a>
                </li>

            </ul>

        </nav>

        <!-- CONFIGURACIÓN -->

        <a
            href="config-doc.html"
            class="configuracion"
        >
            Configuración
        </a>

    </aside>


    <!-- CONTENIDO -->

    <main class="perfil">

        <div class="cabecera">

            <h2>Mi perfil</h2>

            <p>
                Consulta y administra tu información profesional.
            </p>

        </div>


        <div class="cards">

            <!-- INFORMACIÓN PROFESIONAL -->

            <div class="card">

                <div class="icon">
                    <img src="" alt="" aria-hidden="true">
                </div>

                <h3>
                    Información profesional
                </h3>


                <div class="dato">

                    <span>
                        Nombre
                    </span>

                    <strong id="nombre">
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Correo
                    </span>

                    <strong id="correo">
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Especialidad
                    </span>

                    <strong id="especialidad">
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Registro profesional
                    </span>

                    <strong id="registroProfesional">
                    </strong>

                </div>

            </div>


            <!-- RESUMEN -->

            <div class="card">

                <div class="icon">
                    <img src="" alt="" aria-hidden="true">
                </div>

                <h3>
                    Resumen
                </h3>


                <div class="dato">

                    <span>
                        Pacientes activos
                    </span>

                    <strong id="pacientesActivos">
                        0
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Consultas realizadas
                    </span>

                    <strong id="consultasRealizadas">
                        0
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Planes asignados
                    </span>

                    <strong id="planesAsignados">
                        0
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Mensajes pendientes
                    </span>

                    <strong id="mensajesPendientes">
                        0
                    </strong>

                </div>

            </div>

        </div>

    </main>

</div>


<script>

    // ==========================================
    // OBTENER EL NUTRICIONISTA GUARDADO
    // ==========================================

    const usuario = JSON.parse(
        localStorage.getItem("usuario")
    );


    // ==========================================
    // INFORMACIÓN PROFESIONAL
    // ==========================================

    const nombreCompleto =
        (usuario?.nombre || "") +
        " " +
        (usuario?.apellido || "");


    document.getElementById("nombre").textContent =
        nombreCompleto.trim() || "No disponible";


    document.getElementById("correo").textContent =
        usuario?.correo || "No disponible";


    document.getElementById("especialidad").textContent =
        usuario?.especialidad || "Nutricionista";


    document.getElementById("registroProfesional").textContent =
        usuario?.tarjetaProfesional ||
        usuario?.registroProfesional ||
        "No disponible";


    // ==========================================
    // RESUMEN
    // ==========================================

    document.getElementById("pacientesActivos").textContent =
        usuario?.pacientesActivos || 0;


    document.getElementById("consultasRealizadas").textContent =
        usuario?.consultasRealizadas || 0;


    document.getElementById("planesAsignados").textContent =
        usuario?.planesAsignados || 0;


    document.getElementById("mensajesPendientes").textContent =
        usuario?.mensajesPendientes || 0;

</script>

</body>

</html>
