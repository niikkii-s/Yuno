<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Yuno - Registro</title>

<link rel="stylesheet" href="registro.css">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>


</head>

<body>

<div class="container">

<h2>Crear cuenta</h2>

<input
    type="text"
    id="nombre"
    name="nombre"
    placeholder="Nombre completo"
    required
>

<input
    type="email"
    id="correo"
    name="correo"
    placeholder="Correo"
    required
>

<input
    type="date"
    id="fecha_nacimiento"
    name="fecha_nacimiento"
    required
>

<div class="password-container">

    <input
        type="password"
        id="contraseña"
        name="contraseña"
        placeholder="Contraseña"
        required
    >

    <button
        type="button"
        class="mostrar-btn"
        id="mostrarContraseña"
    >
        Mostrar
    </button>

</div>

<div class="password-container">

    <input
        type="password"
        id="confirmarContraseña"
        name="confirmarContraseña"
        placeholder="Confirmar contraseña"
        required
    >

    <button
        type="button"
        class="mostrar-btn"
        id="mostrarConfirmar"
    >
        Mostrar
    </button>

</div>

<div class="fila">

    <input
        type="number"
        id="peso"
        name="peso"
        placeholder="Peso (kg)"
        min="1"
        required
    >

    <input
        type="number"
        id="altura"
        name="altura"
        placeholder="Altura (cm)"
        min="1"
        required
    >

</div>

<select
    id="objetivo"
    name="objetivo"
    required
>

    <option
        value=""
        disabled
        selected
    >
        Selecciona tu objetivo
    </option>

    <option value="Bajar de peso">
        Bajar de peso
    </option>

    <option value="Ganar masa muscular">
        Ganar masa muscular
    </option>

    <option value="Mantener peso">
        Mantener peso
    </option>

    <option value="Mejorar alimentación">
        Mejorar alimentación
    </option>

</select>

<select
    id="restriccion_dieta"
    name="restriccion_dieta"
    required
>

    <option
        value=""
        disabled
        selected
    >
        Restricciones o dieta
    </option>

    <option value="Vegetariano">
        Vegetariano
    </option>

    <option value="Vegano">
        Vegano
    </option>

    <option value="Sin gluten">
        Sin gluten
    </option>

    <option value="Intolerante a la lactosa">
        Intolerante a la lactosa
    </option>

    <option value="Ninguna">
        Ninguna
    </option>

</select>

<button
    type="button"
    class="btn"
    id="btnRegistrar"
>
    Registrarse
</button>

<p id="mensaje"></p>

<a href="login.html">
    Volver a la página principal
</a>

</div>

<script>

    const boton =
        document.getElementById("btnRegistrar");

    const mensaje =
        document.getElementById("mensaje");

        const fechaNacimiento =
          document.getElementById("fecha_nacimiento");

        const hoy =
          new Date().toISOString().split("T")[0];

fechaNacimiento.max = hoy;

    const contraseña =
        document.getElementById("contraseña");

    const confirmarContraseña =
        document.getElementById("confirmarContraseña");

    const mostrarContraseña =
        document.getElementById("mostrarContraseña");

    const mostrarConfirmar =
        document.getElementById("mostrarConfirmar");

    mostrarContraseña.addEventListener("click", () => {

        if (contraseña.type === "password") {

            contraseña.type = "text";

            mostrarContraseña.textContent = "Ocultar";

        } else {

            contraseña.type = "password";

            mostrarContraseña.textContent = "Mostrar";

        }

    });

    mostrarConfirmar.addEventListener("click", () => {

        if (confirmarContraseña.type === "password") {

            confirmarContraseña.type = "text";

            mostrarConfirmar.textContent = "Ocultar";

        } else {

            confirmarContraseña.type = "password";

            mostrarConfirmar.textContent = "Mostrar";

        }

    });

    boton.addEventListener("click", async () => {

        const nombre =
            document.getElementById("nombre").value.trim();

        const correo =
            document.getElementById("correo").value.trim();

        const fecha_nacimiento =
            document.getElementById("fecha_nacimiento").value;

        const contraseñaValor =
            contraseña.value;

        const confirmarContraseñaValor =
            confirmarContraseña.value;

        const peso =
            document.getElementById("peso").value;

        const altura =
            document.getElementById("altura").value;

        const objetivo =
            document.getElementById("objetivo").value;

        const restriccion_dieta =
            document.getElementById("restriccion_dieta").value;

        if (
            nombre === "" ||
            correo === "" ||
            fecha_nacimiento === "" ||
            contraseñaValor === "" ||
            confirmarContraseñaValor === "" ||
            peso === "" ||
            altura === "" ||
            objetivo === "" ||
            restriccion_dieta === ""
        ) {

            mensaje.textContent =
                "Por favor, completa todos los campos.";

            return;

        }

        if (
            contraseñaValor !==
            confirmarContraseñaValor
        ) {

            mensaje.textContent =
                "Las contraseñas no coinciden.";

            return;

        }

        boton.disabled = true;

        boton.textContent = "Registrando...";

        const datosUsuario = {

            nombre,

            correo,

            contrasena: contraseñaValor,

            fecha_nacimiento,

            peso: Number(peso),

            altura: Number(altura),

            objetivo,

            restriccion_dieta

        };

        try {

            const respuesta = await fetch(
                "http://192.168.1.62:3000/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(datosUsuario)

                }
            );

            const datos =
                await respuesta.json();

if (respuesta.ok) {

    mensaje.textContent =
        datos.mensaje ||
        "Usuario registrado correctamente.";

    boton.textContent = "Registro exitoso";

    setTimeout(() => {
        window.location.href = "perfil.html";
    }, 1000);

            } else {

                mensaje.textContent =
                    datos.mensaje ||
                    "No se pudo registrar el usuario.";

                boton.disabled = false;

                boton.textContent = "Registrarse";

            }

        } catch (error) {

            console.error("Error:", error);

            mensaje.textContent =
                "No se pudo conectar con el servidor.";

            boton.disabled = false;

            boton.textContent = "Registrarse";

        }

    });

</script>

</body>
</html>
