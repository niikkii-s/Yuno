<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Yuno - Registro</title>

    <link rel="stylesheet" href="registro.css">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
</head>

<body>

<div class="container">

    <h2>Crear cuenta</h2>


    <!-- INFORMACIÓN PERSONAL -->

    <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Nombre completo"
        required
    >


    <input
        type="email"
        id="correo"
        name="correo"
        placeholder="Correo"
        required
    >


    <!-- EDAD -->

    <input
        type="number"
        id="edad"
        name="edad"
        placeholder="Edad"
        min="1"
        max="120"
        required
    >


    <!-- CONTRASEÑA -->

    <div class="password-container">

        <input
            type="password"
            id="contraseña"
            name="contraseña"
            placeholder="Contraseña"
            required
        >

        <button
            type="button"
            class="mostrar-btn"
            id="mostrarContraseña"
        >
            Mostrar
        </button>

    </div>


    <!-- CONFIRMAR CONTRASEÑA -->

    <div class="password-container">

        <input
            type="password"
            id="confirmarContraseña"
            name="confirmarContraseña"
            placeholder="Confirmar contraseña"
            required
        >

        <button
            type="button"
            class="mostrar-btn"
            id="mostrarConfirmar"
        >
            Mostrar
        </button>

    </div>


    <!-- DATOS FÍSICOS -->

    <div class="fila">

        <input
            type="number"
            id="peso"
            name="peso"
            placeholder="Peso (kg)"
            min="1"
            required
        >

        <input
            type="number"
            id="altura"
            name="altura"
            placeholder="Altura (cm)"
            min="1"
            required
        >

    </div>


    <!-- OBJETIVO / DIETA -->

    <select
        id="objetivo"
        name="objetivo"
        required
    >

        <option
            value=""
            disabled
            selected
        >
            Restricciones o dieta
        </option>

        <option value="Vegetariano">
            Vegetariano
        </option>

        <option value="Vegano">
            Vegano
        </option>

        <option value="Sin gluten">
            Sin gluten
        </option>

        <option value="Intolerante a la lactosa">
            Intolerante a la lactosa
        </option>

        <option value="Ninguna">
            Ninguna
        </option>

    </select>


    <!-- BOTÓN REGISTRARSE -->

    <button
        type="button"
        class="btn"
        id="btnRegistrar"
    >
        Registrarse
    </button>


    <!-- MENSAJE -->

    <p id="mensaje"></p>


    <!-- VOLVER AL LOGIN -->

    <a href="login.html">
        Volver a la página principal
    </a>

</div>


<script>

    // ==========================================
    // ELEMENTOS
    // ==========================================

    const boton =
        document.getElementById("btnRegistrar");

    const mensaje =
        document.getElementById("mensaje");

    const contraseña =
        document.getElementById("contraseña");

    const confirmarContraseña =
        document.getElementById("confirmarContraseña");

    const mostrarContraseña =
        document.getElementById("mostrarContraseña");

    const mostrarConfirmar =
        document.getElementById("mostrarConfirmar");


    // ==========================================
    // MOSTRAR / OCULTAR CONTRASEÑA
    // ==========================================

    mostrarContraseña.addEventListener("click", () => {

        if (contraseña.type === "password") {

            contraseña.type = "text";

            mostrarContraseña.textContent = "Ocultar";

        } else {

            contraseña.type = "password";

            mostrarContraseña.textContent = "Mostrar";

        }

    });


    // ==========================================
    // MOSTRAR / OCULTAR CONFIRMACIÓN
    // ==========================================

    mostrarConfirmar.addEventListener("click", () => {

        if (confirmarContraseña.type === "password") {

            confirmarContraseña.type = "text";

            mostrarConfirmar.textContent = "Ocultar";

        } else {

            confirmarContraseña.type = "password";

            mostrarConfirmar.textContent = "Mostrar";

        }

    });


    // ==========================================
    // REGISTRAR USUARIO
    // ==========================================

    boton.addEventListener("click", async () => {

        const nombre =
            document.getElementById("nombre").value.trim();

        const correo =
            document.getElementById("correo").value.trim();

        const edad =
            document.getElementById("edad").value;

        const contraseñaValor =
            contraseña.value;

        const confirmarContraseñaValor =
            confirmarContraseña.value;

        const peso =
            document.getElementById("peso").value;

        const altura =
            document.getElementById("altura").value;

        const objetivo =
            document.getElementById("objetivo").value;


        // ==========================================
        // VALIDAR CAMPOS
        // ==========================================

        if (
            nombre === "" ||
            correo === "" ||
            edad === "" ||
            contraseñaValor === "" ||
            confirmarContraseñaValor === "" ||
            peso === "" ||
            altura === "" ||
            objetivo === ""
        ) {

            mensaje.textContent =
                "Por favor, completa todos los campos.";

            return;

        }


        // ==========================================
        // VALIDAR CONTRASEÑAS
        // ==========================================

        if (
            contraseñaValor !==
            confirmarContraseñaValor
        ) {

            mensaje.textContent =
                "Las contraseñas no coinciden.";

            return;

        }


        // ==========================================
        // DESACTIVAR BOTÓN
        // ==========================================

        boton.disabled = true;

        boton.textContent = "Registrando...";


        // ==========================================
        // DATOS DEL USUARIO
        // ==========================================

        const datosUsuario = {

            nombre,

            correo,

            contraseña: contraseñaValor,

            edad: Number(edad),

            peso: Number(peso),

            altura: Number(altura),

            objetivo

        };


        try {

            // ==========================================
            // ENVIAR AL BACKEND
            // ==========================================

            const respuesta = await fetch(
                "http://172.29.80.73:3000/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(datosUsuario)

                }
            );


            // ==========================================
            // RESPUESTA DEL SERVIDOR
            // ==========================================

            const datos =
                await respuesta.json();


            // ==========================================
            // REGISTRO CORRECTO
            // ==========================================

            if (respuesta.ok) {

                mensaje.textContent =
                    datos.mensaje ||
                    "Usuario registrado correctamente.";


                setTimeout(() => {

                    window.location.href =
                        "perfil.html";

                }, 1000);

            }


            // ==========================================
            // ERROR DE REGISTRO
            // ==========================================

            else {

                mensaje.textContent =
                    datos.mensaje ||
                    "No se pudo registrar el usuario.";

                boton.disabled = false;

                boton.textContent = "Registrarse";

            }

        }


        // ==========================================
        // ERROR DE CONEXIÓN
        // ==========================================

        catch (error) {

            console.error("Error:", error);

            mensaje.textContent =
                "No se pudo conectar con el servidor.";

            boton.disabled = false;

            boton.textContent = "Registrarse";

        }

    });

</script>

</body>
</html>
