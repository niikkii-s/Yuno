<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar contraseña | Yuno-Doc</title>

    <link
        rel="stylesheet"
        href="recuperar-doc.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
        rel="stylesheet"
    >

</head>

<body>


    <div class="recuperar-container">

        <div class="recuperar-card">


            <!-- ================= LOGO ================= -->

            <div class="logo">

                <a href="index-doc.html">
                    Yuno
                </a>

            </div>


            <!-- ================= ICONO ================= -->

            <div class="icono">
                🔐
            </div>


            <!-- ================= TITULO ================= -->

            <h1>
                Recuperar contraseña
            </h1>


            <!-- ================= DESCRIPCIÓN ================= -->

            <p class="descripcion">

                Ingresa el correo electrónico asociado
                a tu cuenta de nutricionista y te enviaremos
                las instrucciones para restablecer tu contraseña.

            </p>


            <!-- ================= FORMULARIO ================= -->

            <form id="formRecuperar">

                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="Ingresa tu correo"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Enviar instrucciones
                </button>

            </form>


            <!-- ================= MENSAJE ================= -->

            <div
                class="mensaje"
                id="mensaje"
            >

                Si el correo está registrado,
                recibirás las instrucciones para
                recuperar tu contraseña.

            </div>


            <!-- ================= VOLVER ================= -->

            <a
                href="config-doc.html"
                class="volver"
            >
                ← Volver a configuración
            </a>


        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const formulario =
            document.getElementById(
                "formRecuperar"
            );


        const mensaje =
            document.getElementById(
                "mensaje"
            );


        formulario.addEventListener(
            "submit",
            function (evento) {

                evento.preventDefault();


                const correo =
                    document.getElementById(
                        "correo"
                    ).value.trim();


                if (correo === "") {
                    return;
                }


                mensaje.style.display =
                    "block";


                formulario.reset();

            }
        );

    </script>


</body>

</html>
