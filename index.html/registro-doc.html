<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Yuno-Doc</title>
    <link rel="stylesheet" href="registro-doc.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>

<body>

<div class="container">

    <h2>Crear cuenta</h2>

    <!-- INFORMACIÓN PERSONAL -->
    <input type="text" placeholder="Nombre(s)" required>
    <input type="text" placeholder="Apellido(s)" required>
    <input type="email" placeholder="Correo electrónico" required>
    <input type="tel" placeholder="Teléfono" required>

    <!-- INFORMACIÓN PROFESIONAL -->
    <input type="text" placeholder="Número de tarjeta profesional" required>

    <!-- CONTRASEÑA -->
    <input type="password" placeholder="Contraseña" required>
    <input type="password" placeholder="Confirmar contraseña" required>

    <button type="submit" class="btn">
        <a href="">Crear cuenta</a>
    </button>

    <p class="login">
      ¿Ya tienes una cuenta?
    <a href="login-doc.html">Inicia sesión</a>
</p>

</div>


</body>
</html>
