<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Yuno-Doc</title>
    <link rel="stylesheet" href="registro-doc.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>

<body>

<div class="container">

    <h2>Registro de Nutricionista</h2>

    <!-- INFORMACIÓN PERSONAL -->
    <input type="text" placeholder="Nombre(s)">
    <input type="text" placeholder="Apellido(s)">
    <input type="email" placeholder="Correo electrónico">
    <input type="tel" placeholder="Teléfono">

    <!-- INFORMACIÓN PROFESIONAL -->
    <input type="text" placeholder="Número de tarjeta profesional">

    <!-- CONTRASEÑA -->
    <input type="password" placeholder="Contraseña">
    <input type="password" placeholder="Confirmar contraseña">

    <button class="btn">Crear cuenta</button>

    <p class="login">
      ¿Ya tienes una cuenta?
    <a href="login-doc.html">Inicia sesión</a>
</p>

</div>


</body>
</html>
